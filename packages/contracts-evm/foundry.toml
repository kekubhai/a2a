[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
optimizer = true
optimizer_runs = 200
via_ir = false
evm_version = "cancun"
ffi = false
fs_permissions = [{ access = "read", path = "out" }]

[profile.ci]
verbosity = 4
fuzz = { runs = 256 }

[fmt]
line_length = 100
tab_width = 2
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"
number_underscore = "thousands"
single_line_statement_blocks = "preserve"
sort_imports = true
